<section class="theme-switcher">
  <div class="theme-group">
    <span class="theme-label">Тема:</span>
    @for (themeId of themeIds; track themeId) {
      <button matButton [class.active]="theme() === themeId" (click)="setTheme(themeId)">
        {{ themeId }}
      </button>
    }
  </div>
  <div class="theme-group">
    <span class="theme-label">Схема:</span>
    @for (scheme of colorSchemes; track scheme) {
      <button matButton [class.active]="preferredColorScheme() === scheme" (click)="setPreferredColorScheme(scheme)">
        {{ scheme }}
      </button>
    }
  </div>
</section>
