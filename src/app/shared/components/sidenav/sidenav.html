<ng-container *transloco="let t">
  <amk-toolbar />

  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav
      class="sidenav left-sidenav"
      id="app-sidenav"
      [attr.aria-label]="t('sidenav.navigationLabel')"
      [fixedInViewport]="true"
      [mode]="leftMode()"
      [opened]="opened()"
      (closedStart)="close()"
    >
      <div class="sidenav-wrapper">
        @if (busy()) {
          <mat-progress-bar class="progress-bar" [attr.aria-label]="t('sidenav.progressLabel')" mode="indeterminate" />
        }

        @if (hasContext()) {
          <h2 class="context-title" [attr.aria-label]="contextTitle()">
            {{ contextTitle() }}
          </h2>
        }

        <mat-nav-list class="shape-small height-medium" style="padding: 1rem 0">
          @for (node of menu(); track node.id) {
            <amk-sidenav-node
              [disabled]="busy()"
              [expandedIds]="expandedIds()"
              [node]="node"
              (navigate)="close()"
              (toggleNode)="toggleNode($event)"
            />
          }
        </mat-nav-list>

        <span class="spacer"></span>

        @if (hasContext()) {
          <mat-divider />

          <button class="tertiary shape-none" (click)="goBack()" matButton="text" type="button">
            <mat-icon>arrow_back</mat-icon>
            {{ backLabel() }}
          </button>
        }

        <mat-divider />

        <amk-footer />
      </div>
    </mat-sidenav>

    @if (hasRightContent()) {
      <mat-sidenav
        class="sidenav right-sidenav"
        id="app-right-sidenav"
        [attr.aria-label]="t('sidenav.sidePanelLabel')"
        [fixedInViewport]="true"
        [mode]="rightMode()"
        [opened]="sidePanelOpened()"
        (closedStart)="closeRight()"
        position="end"
      >
        <ng-template [cdkPortalOutlet]="activePortal()"></ng-template>
      </mat-sidenav>
    }

    <mat-sidenav-content class="sidenav-content">
      <amk-breadcrumbs />
      @if (hasRightContent()) {
        <div class="sticky-wrapper">
          <button
            class="right-toggle-btn secondary"
            [attr.aria-expanded]="sidePanelOpened()"
            [attr.aria-label]="sidePanelToggleLabel()"
            (click)="toggleSidePanel()"
            matMiniFab
            type="button"
          >
            <mat-icon>{{ sidePanelOpened() ? 'chevron_right' : 'chevron_left' }}</mat-icon>
          </button>
        </div>
      }
      <router-outlet />
    </mat-sidenav-content>
  </mat-sidenav-container>
</ng-container>
