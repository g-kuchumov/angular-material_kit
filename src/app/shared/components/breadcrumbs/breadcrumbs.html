@for (crumb of breadcrumbs(); track $index) {
  @if (!$first) {
    <mat-icon class="separator secondary">chevron_right</mat-icon>
  }
  <button
    class="crumb height-medium secondary"
    matButton="elevated"
    [routerLink]="crumb.route"
    [class.active]="$last"
  >
    {{ crumb.label }}
  </button>
}
